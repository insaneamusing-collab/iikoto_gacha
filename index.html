<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>いいことカプセル</title>
  <meta name="description" content="いいことスタンプをためて、カプセルのガチャを回そう">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="いいこと">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="#e9a93b"/>
          <path d="M2 16a14 14 0 0 0 28 0z" fill="#f3eee2"/>
          <path d="M2 16h28" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>
          <circle cx="10.5" cy="10" r="2.4" fill="#fff" opacity=".6"/>
        </svg>
        <span class="brand-name">いいことカプセル</span>
      </div>
      <button class="icon-btn" id="parentButton" aria-label="おとなの せってい" data-act="settings"></button>
    </header>

    <main id="main" tabindex="-1"></main>

    <nav class="tabbar" aria-label="メニュー">
      <button data-go="home" class="tab"></button>
      <button data-go="gacha" class="tab"></button>
      <button data-go="tickets" class="tab"></button>
      <button data-go="history" class="tab"></button>
    </nav>
  </div>

  <dialog id="dialog" class="modal"><div id="dialogContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
